# Local development stack: Postgres and Redis only.
#
# The app itself runs on the host with `npm run dev`, so changes reload. To run
# the whole thing in containers instead, use docker-compose.prod.yml.
name: thrum

services:
  postgres:
    image: postgres:17-alpine
    container_name: thrum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thrum
      POSTGRES_PASSWORD: thrum
      POSTGRES_DB: thrum
    ports:
      # Bound to the loopback interface deliberately. "5432:5432" listens on
      # every interface, which puts a trust-nothing dev database with the
      # password `thrum` on the local network -- and on some setups, through the
      # router. Nothing outside this machine needs to reach it.
      - "127.0.0.1:5432:5432"
    volumes:
      - thrum-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thrum -d thrum"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: thrum-redis
    restart: unless-stopped
    # Optional in development: without REDIS_URL the app uses in-memory rate
    # limits and presence, which is correct for a single process. It is here so
    # the multi-instance path can be exercised locally.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thrum-pgdata:
